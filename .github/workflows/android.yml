name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk TerminalZero.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TerminalZero-apk
          path: android/TerminalZero.apk

      # Publica o APK numa release "android-latest" para baixar direto pelo celular.
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest TerminalZero.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "TerminalZero Android (${GITHUB_REF_NAME})" \
            --notes "APK gerado automaticamente do commit ${{ github.sha }}."
